<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stages INPT – Plateforme SOA</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="vendor/bpmn-js/assets/bpmn-font/css/bpmn.css">
</head>
<body>
  <!-- ============ Connexion ============ -->
  <section id="ecran-connexion" class="connexion">
    <div class="connexion-carte">
      <div class="logo"><span>INPT</span>Plateforme des stages</div>
      <p class="sous-titre">Gestion intelligente des stages et des offres de recrutement</p>
      <form id="form-connexion">
        <label>Identifiant<input name="username" autocomplete="username" required></label>
        <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primaire large" type="submit">Se connecter</button>
        <p id="erreur-connexion" class="erreur"></p>
      </form>
      <div class="comptes-demo">
        <p>Comptes de démonstration</p>
        <button data-u="E2026001" data-p="Etudiant@2026">Étudiante · Yasmine Benali (AMOA, 2A)</button>
        <button data-u="E2026002" data-p="Etudiant@2026">Étudiant · Omar Haddad (ASEDS, 3A)</button>
        <button data-u="E2026003" data-p="Etudiant@2026">Étudiante · Salma El Amrani (DATA, 2A)</button>
        <button data-u="atlas" data-p="Entreprise@2026">Entreprise · Atlas Digital (Casablanca)</button>
        <button data-u="nova" data-p="Entreprise@2026">Entreprise · Nova Consulting (Rabat)</button>
        <button data-u="admin" data-p="Admin@2026">Responsable des stages</button>
      </div>
    </div>
  </section>

  <!-- ============ Application ============ -->
  <div id="app" class="app" hidden>
    <aside class="barre">
      <div class="logo"><span>INPT</span>Stages</div>
      <nav id="menu"></nav>
      <div class="profil">
        <div id="profil-nom"></div>
        <div id="profil-role" class="muted"></div>
        <button id="btn-cle" class="btn lien">Ma clé d'API</button><br>
        <button id="btn-deconnexion" class="btn lien">Se déconnecter</button>
      </div>
    </aside>
    <main>
      <header class="entete">
        <h1 id="titre-vue"></h1>
        <div id="actions-vue"></div>
      </header>
      <div id="vue"></div>
    </main>
  </div>

  <div id="modale" class="modale" hidden>
    <div class="modale-boite">
      <button class="fermer" id="modale-fermer" aria-label="Fermer">×</button>
      <div id="modale-contenu"></div>
    </div>
  </div>
  <div id="toasts"></div>

  <script src="vendor/bpmn-js/bpmn-navigated-viewer.production.min.js" defer></script>
  <script src="soap.js"></script>
  <script src="app.js"></script>
</body>
</html>

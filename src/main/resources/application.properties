# ---------------------------------------------------------------
# Configuration de la plateforme (surchargeable par variables
# d'environnement : db.url -> DB_URL, server.port -> SERVER_PORT)
# ---------------------------------------------------------------
server.port=8090
# server.base-url : par défaut http://localhost:<server.port>

# Base de données : H2 (par défaut) ou PostgreSQL
# PostgreSQL : db.url=jdbc:postgresql://localhost:5432/stages
db.url=jdbc:h2:./data/stages;AUTO_SERVER=TRUE
db.user=stages
db.password=stages

# Base dédiée au moteur BPMN Flowable
bpmn.db.url=jdbc:h2:./data/flowable;AUTO_SERVER=TRUE
bpmn.db.user=sa
bpmn.db.password=

# Compte technique utilisé par l'orchestrateur pour appeler les services
systeme.username=systeme
systeme.password=Systeme@2026
# Clé d'API REST du compte technique (démonstration ; à fournir par variable d'environnement en production)
systeme.api-key=stg_demo_systeme

# Résilience des appels inter-services
client.tentatives=3
client.delai-ms=400
client.timeout-ms=5000

# Délai avant relance de l'entreprise si aucune décision (ISO-8601)
processus.delai-relance=P3D

# Rappels automatiques des dates limites (jours avant échéance)
rappels.jours-avant=3
rappels.periode-heures=24

# E-mails : envoyés en SMTP vers Mailpit (boîte de test locale, interface http://localhost:8025)
# mail.actif=false : e-mails seulement journalisés et archivés en base
mail.actif=true
mail.smtp.hote=localhost
mail.smtp.port=1025
mail.expediteur=Bureau des stages INPT <stages@inpt-stages.example>
mail.timeout-ms=3000

# Règles de gestion
regles.max-candidatures-actives=5

# Plateforme + PostgreSQL + Mailpit : docker compose up --build
# Interface : http://localhost:8090   Boîte e-mail de test : http://localhost:8025
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stages
      POSTGRES_PASSWORD: stages
      POSTGRES_DB: stages
    volumes:
      - ./docker/init-flowable.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stages"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # interface web de la boîte de réception
      - "1025:1025"   # serveur SMTP

  plateforme:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stages
      DB_USER: stages
      DB_PASSWORD: stages
      BPMN_DB_URL: jdbc:postgresql://postgres:5432/flowable
      BPMN_DB_USER: stages
      BPMN_DB_PASSWORD: stages
      MAIL_SMTP_HOTE: mailpit

volumes:
  pgdata:
